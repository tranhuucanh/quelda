[workspace]
resolver = "3"
members = [
    "crates/quelda-core",
    "crates/quelda-wasm",
    "crates/quelda-cli",
    "crates/quelda-testkit",
    "crates/quelda-eval",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["0xTh3OKrypt <tranhuucanh39@gmail.com>"]
repository = "https://github.com/tranhuucanh/quelda"
homepage = "https://github.com/tranhuucanh/quelda"
description = "PDF security scanner: one PDF + policy in, verdict out"

[workspace.dependencies]
quelda-core = { path = "crates/quelda-core", version = "0.1.0-rc.1" }

# Test fixtures include >1 GiB Flate bombs; unoptimized deflate + Adler-32 make
# generation ~8x slower in dev builds.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

# Native CLI binary.
[profile.release]
lto = true
codegen-units = 1
strip = true

# WASM for the npm package: optimized for speed, built with SIMD by
# scripts/wasm-build.sh (ADR #31; size budget: design §8.2).
[profile.release-wasm]
inherits = "release"
opt-level = 3
panic = "abort"
# wasm-bindgen needs the `target_features` section; scripts/wasm-build.sh
# strips names/debug with wasm-opt after wasm-bindgen.
strip = false

# Release with symbols, for profilers (`--profile profiling`).
[profile.profiling]
inherits = "release"
debug = true
strip = false
