# Release (plan Step 14, ADR #34, ADR #37). Push a tag `vX.Y.Z` or `vX.Y.Z-rc.N`
# that equals the Cargo.toml version (scripts/bump-version.sh) on a commit of main.
#
# Everything is tested before anything is published; a failure there publishes
# nothing (delete the tag, fix, tag the same version again):
#
#   meta       tag == Cargo.toml version, on main, version not on npm yet
#   build      CLI for Linux x64/arm64 (static musl) and macOS arm64, each on
#              its own runner; the binary as shipped is tested (containers
#              `scratch`, alpine, debian, ubuntu, busybox; every golden case;
#              docs examples and install snippets)
#   npm-test   WASM + package tests, examples in headless Chrome; packs the
#              exact tarball that will be published
#   brew-test  the formula, pointed at the built archives on disk, installed,
#              tested and audited on macOS (rc too)
#
# Then one job, `publish`, in the `release` environment (required reviewer: the
# maintainer, so it waits for approval). It checks both tokens first, then, from
# the most reversible to the least:
#
#   1. GitHub Release as a draft (invisible; deletable) + build attestations
#   2. npm publish of the tested tarball (cannot be undone: last irreversible
#      step, after every test and token check)
#   3. the draft becomes the release (`-rc`: pre-release, npm dist-tag `next`)
#   4. final releases only: the published downloads are checked against
#      SHA256SUMS, then Formula/quelda.rb is pushed to tranhuucanh/homebrew-quelda
#
# Every publish step skips what is already done, so a failed `publish` job is
# fixed by "Re-run failed jobs" (e.g. after correcting a secret).
#
# Secrets (environment `release`): NPM_TOKEN (until npm trusted publishing is
# set up), HOMEBREW_TAP_TOKEN (fine-grained PAT: Contents read/write on the tap only).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: tag == Cargo.toml version, commit on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'; then
            echo "::error::version $version is not X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          # A version on npm can never be published again: fail before building.
          # (A re-run of `publish` after npm succeeded does not come back here.)
          if [ "$(npm view "quelda@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::error::quelda@$version is already on npm; bump the version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=${version%%-*}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      # Static musl binaries linked by the toolchain's own lld (no musl-gcc).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        run: |
          QUELDA_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)"
          QUELDA_BUILD_DATE="$(date -u +%Y-%m-%d)"
          export QUELDA_BUILD_COMMIT QUELDA_BUILD_DATE
          cargo build --locked --release -p quelda-cli --target ${{ matrix.target }}
          bin="target/${{ matrix.target }}/release/quelda"
          "$bin" --version
          test "$("$bin" --version | head -n1)" = "quelda ${{ needs.meta.outputs.version }}"
      - name: static binary (Linux)
        if: matrix.platform
        run: file "target/${{ matrix.target }}/release/quelda" | grep -E 'statically linked|static-pie linked'
      - name: fixtures + native golden verdicts
        run: |
          cargo run --locked -q -p quelda-testkit --bin gen-fixtures
          cargo run --locked -q -p quelda-wasm --example wasm_golden
      - name: test the binary on the runner
        run: node scripts/cli-dist-test.mjs --bin "target/${{ matrix.target }}/release/quelda"
      - name: test the binary in containers
        if: matrix.platform
        run: |
          node scripts/cli-dist-test.mjs --bin "target/${{ matrix.target }}/release/quelda" --docker ${{ matrix.platform }}
          node scripts/docs-examples-test.mjs --bin "target/${{ matrix.target }}/release/quelda" --docker ${{ matrix.platform }}
      - name: package
        run: |
          mkdir -p stage dist
          cp "target/${{ matrix.target }}/release/quelda" LICENSE stage/
          tar -C stage -czf "dist/quelda-${{ matrix.target }}.tar.gz" quelda LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: quelda-${{ matrix.target }}
          path: dist/quelda-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  npm-test:
    needs: meta
    runs-on: ubuntu-24.04
    env:
      BINARYEN_VERSION: "133"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: install binaryen (wasm-opt)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: fixtures + wasm tests
        run: |
          cargo run --locked -q -p quelda-testkit --bin gen-fixtures
          scripts/wasm-test.sh
      - name: npm tests (package + examples from the packed tarball)
        working-directory: packages/quelda-js
        run: |
          npm ci --no-audit --no-fund
          npm test
          QUELDA_BROWSER=1 npm run test:examples
          test "$(node -p 'require("./package.json").version')" = "${{ needs.meta.outputs.version }}"
      - name: pack the tarball to publish
        working-directory: packages/quelda-js
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls -l "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/quelda-${{ needs.meta.outputs.version }}.tgz
          if-no-files-found: error

  brew-test:
    needs: [meta, build]
    # The formula is macOS arm64 only (ADR #38).
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: quelda-*
          path: ${{ runner.temp }}/rel/releases/download/v${{ needs.meta.outputs.version }}
          merge-multiple: true
      - name: test formula (downloads from the built archives on disk)
        run: |
          dir="$RUNNER_TEMP/rel/releases/download/v${{ needs.meta.outputs.version }}"
          (cd "$dir" && shasum -a 256 quelda-*.tar.gz) > SHA256SUMS
          node scripts/homebrew-formula.mjs "${{ needs.meta.outputs.version }}" SHA256SUMS --local "$RUNNER_TEMP/rel" > quelda.rb
          cat quelda.rb
      - name: brew install / test / audit (local tap)
        run: |
          brew tap-new --no-git quelda-ci/local
          cp quelda.rb "$(brew --repository quelda-ci/local)/Formula/quelda.rb"
          brew trust quelda-ci/local 2>/dev/null || true
          brew install --formula quelda-ci/local/quelda
          brew test quelda-ci/local/quelda
          brew audit --strict --formula quelda-ci/local/quelda
          test "$(quelda --version | head -n1)" = "quelda ${{ needs.meta.outputs.version }}"

  publish:
    needs: [meta, build, npm-test, brew-test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm >= 11.5.1: trusted publishing (OIDC) when configured on npmjs.com.
      - run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: quelda-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm
      - name: check the tokens before publishing anything
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm whoami || { echo "::error::NPM_TOKEN is not valid"; exit 1; }
          else
            echo "NPM_TOKEN not set: npm trusted publishing must be configured for this workflow"
          fi
          if [ "$PRERELEASE" = "false" ] || [ -n "$TAP_TOKEN" ]; then
            git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/tranhuucanh/homebrew-quelda.git" "$RUNNER_TEMP/tap" \
              || { echo "::error::HOMEBREW_TAP_TOKEN cannot read tranhuucanh/homebrew-quelda"; exit 1; }
            git -C "$RUNNER_TEMP/tap" push --dry-run -q origin HEAD:refs/heads/quelda-token-check \
              || { echo "::error::HOMEBREW_TAP_TOKEN cannot push to tranhuucanh/homebrew-quelda"; exit 1; }
          fi
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -- quelda-*.tar.gz
          test "$#" -eq 3
          sha256sum -- "$@" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: release notes from CHANGELOG.md
        run: |
          awk -v h="## [${{ needs.meta.outputs.base }}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section ${{ needs.meta.outputs.base }}"; exit 1; }
          cat >> notes.md <<'EOF'

          ### Install

          See the [README](https://github.com/tranhuucanh/quelda#install). Verify a download with
          `sha256sum -c SHA256SUMS --ignore-missing` and
          `gh attestation verify <file> --repo tranhuucanh/quelda`.
          EOF
      - name: 1. GitHub Release as a draft
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" = "true" ]; then
              gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
              --draft --verify-tag --title "quelda $VERSION" --notes-file notes.md
          fi
      - name: 2. npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$(npm view "quelda@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "quelda@$VERSION is already on npm (earlier run)"
            exit 0
          fi
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          npm publish "./npm/quelda-$VERSION.tgz" --provenance --access public --tag "$tag"
      - name: 3. publish the GitHub Release
        run: |
          flags=(--draft=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release edit "$GITHUB_REF_NAME" "${flags[@]}"
      - name: 4. Homebrew tap (final releases)
        if: needs.meta.outputs.prerelease == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # The formula pins the published downloads: check them first.
          mkdir -p "$RUNNER_TEMP/check"
          gh release download "$GITHUB_REF_NAME" --pattern 'quelda-*.tar.gz' --pattern SHA256SUMS --dir "$RUNNER_TEMP/check"
          (cd "$RUNNER_TEMP/check" && sha256sum -c SHA256SUMS && cmp SHA256SUMS "$GITHUB_WORKSPACE/dist/SHA256SUMS")
          for f in dist/quelda-*.tar.gz; do
            curl -fsSL -o /dev/null "https://github.com/tranhuucanh/quelda/releases/download/$GITHUB_REF_NAME/${f#dist/}"
          done
          node scripts/homebrew-formula.mjs "$VERSION" dist/SHA256SUMS > quelda.rb
          tap="$RUNNER_TEMP/tap"
          mkdir -p "$tap/Formula"
          cp quelda.rb "$tap/Formula/quelda.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/quelda.rb
          if git diff --cached --quiet; then
            echo "Formula/quelda.rb is already at $VERSION (earlier run)"
            exit 0
          fi
          git commit -q -m "quelda $VERSION"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/tranhuucanh/homebrew-quelda.git" HEAD
