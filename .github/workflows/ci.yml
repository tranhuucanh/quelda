name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Fixtures (tests/) are not committed (ADR #12): generate them first.
      - name: generate fixtures
        run: cargo run -p quelda-testkit --bin gen-fixtures
      - name: test
        run: cargo test --workspace
      - name: build wasm
        run: cargo build -p quelda-core -p quelda-wasm --target wasm32-unknown-unknown --profile release-wasm

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # WASM binding (plan Step 11): wasm32 verdicts == native lib, size budget
  # (design §8.2), built package smoke test. scripts/wasm-test.sh.
  wasm:
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: "133"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Must equal the exact `wasm-bindgen` pin in crates/quelda-wasm/Cargo.toml.
      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: install binaryen (wasm-opt)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: generate fixtures
        run: cargo run -p quelda-testkit --bin gen-fixtures
      - name: wasm tests + size budget
        run: scripts/wasm-test.sh
      # npm package (plan Step 12): uses target/wasm-pkg + tests/wasm/golden.json
      # from wasm-test.sh. Mock-worker + real-engine tests, types, npm pack.
      - name: npm package tests
        working-directory: packages/quelda-js
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: npm examples (Vite, webpack) from the packed package
        working-directory: packages/quelda-js
        run: npm run test:examples
