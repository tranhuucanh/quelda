[package]
name = "quelda-cli"
description = "quelda command-line scanner (thin wrapper around quelda-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "quelda"
path = "src/main.rs"

[dependencies]
quelda-core.workspace = true
serde_json = "1.0.154"
sha2 = "0.11.0"

[dev-dependencies]
assert_cmd = "2"
jsonschema = { version = "0.61.0", default-features = false }
