# Declarative rules, category `postscript` (design §5.4, §5.7).
# Names are matched after `#xx` decoding; indirect values are followed one level.

[[rule]]
id = "POSTSCRIPT.XOBJECT"
category = "postscript"
severity = "critical"
default_action = "block"
locked = true
stage = "stable"
since = "0.1.0"
message = "PostScript XObject"
description = "A PostScript XObject (/Subtype /PS), a Form XObject marked /Subtype2 /PS, or a Form XObject with an alternate /PS stream (ISO 32000-1 §8.8.2, PDF 1.3): raw PostScript that renderers built on a PostScript interpreter (Ghostscript) may execute."
match = { dict = { any = [ { key = "Subtype", name = "PS" }, { key = "Subtype2", name = "PS" }, { all = [ { key = "Subtype", name = "Form" }, { key = "PS" } ] } ] } }

[[rule]]
id = "POSTSCRIPT.CONTENT_OP"
category = "postscript"
severity = "critical"
default_action = "block"
locked = true
stage = "stable"
since = "0.1.0"
message = "PostScript operator in a content stream"
description = "The PS content operator (ISO 32000-1 §8.8.2, deprecated) hands its operand to a PostScript interpreter. Checked in every content stream: page contents, Form XObjects, appearance streams, Type 3 glyph procedures, and streams of unknown role."
match = { content_op = "PS" }
