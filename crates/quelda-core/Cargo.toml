[package]
name = "quelda-core"
description = "quelda scan engine: PDF parser, rules, policy, verdict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# SIMD byte search (raw scan, plan Step 16); also used by serde_json.
memchr = { version = "2.7", default-features = false, features = ["std"] }
miniz_oxide = "0.9"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.0"

[dev-dependencies]
# Reference zlib (port of zlib 1.3) for the truncated-Flate equivalence test.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
jsonschema = { version = "0.61.0", default-features = false }
# In-memory fixtures (testkit never depends on core: writer ≠ parser).
quelda-testkit = { path = "../quelda-testkit" }
toml = "1.2.1"

[build-dependencies]
toml = "1.2.1"
