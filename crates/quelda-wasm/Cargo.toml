[package]
name = "quelda-wasm"
description = "WebAssembly binding for quelda (thin wrapper around quelda-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quelda-core.workspace = true
# Exact pin: the `wasm-bindgen` CLI used by scripts/wasm-build.sh must be the
# same version (`cargo install wasm-bindgen-cli --version 0.2.130 --locked`).
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
